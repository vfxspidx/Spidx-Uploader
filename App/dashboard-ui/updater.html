<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spidx Updater</title>
<link rel="icon" type="image/png" href="{{FAVICON}}">
<script>window.SPIDX_UI = /*__UI__*/{};</script>
<script>
(function () {
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
    var choice = (window.SPIDX_UI && window.SPIDX_UI.theme) || "auto";
    function apply() { root.setAttribute("data-theme", choice === "auto" ? (mq && mq.matches ? "light" : "dark") : choice); }
    if (mq && mq.addEventListener) mq.addEventListener("change", apply);
    apply();
})();
</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="shell">

    <header class="bar">
        <img class="bar-logo" src="{{LOGO}}" alt="" width="26" height="26">
        <b class="bar-title" data-no-i18n>Spidx Updater</b>
        <span class="grow"></span>
        <div class="menu-wrap">
            <button class="pill-btn" id="langBtn" type="button" aria-haspopup="true" aria-label="Language" title="Language"></button>
            <div class="menu" id="langMenu" hidden></div>
        </div>
        <div class="menu-wrap">
            <button class="icon-btn" id="moreBtn" type="button" aria-haspopup="true" aria-label="More" title="More">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
            </button>
            <div class="menu" id="moreMenu" hidden>
                <button type="button" id="mCheck">Check again</button>
                <button type="button" id="mNotes">Release notes</button>
                <button type="button" id="mCopy">Copy version info</button>
            </div>
        </div>
    </header>

    <main class="stage" id="stage" data-state="checking">
        <div class="mark" id="mark">
            <svg class="ring spin" id="ring" viewBox="0 0 160 160" aria-hidden="true">
                <circle class="track" cx="80" cy="80" r="70"/>
                <circle class="arc" id="arc" cx="80" cy="80" r="70" pathLength="100"/>
            </svg>
            <div class="tile"><img src="{{LOGO}}" alt="Spidx Uploader" width="84" height="84"></div>
        </div>

        <h1 id="title">Checking for updates</h1>
        <div class="pill" id="pill" hidden></div>
        <p class="sub" id="sub"></p>

        <div class="meter" id="meter" hidden>
            <div class="meter-bar"><i id="meterFill"></i></div>
            <div class="meter-row"><span id="meterLeft"></span><span id="meterRight"></span></div>
        </div>

        <ul class="steps" id="steps" hidden></ul>
    </main>

    <footer class="foot">
        <button class="link" id="repairBtn" type="button">Check and repair files</button>
        <span class="grow"></span>
        <a class="btn ghost" id="notesBtn" href="https://spidxuploader.com/changelog" target="_blank" rel="noopener noreferrer">What's new &#8599;</a>
        <button class="btn ghost" id="cancelBtn" type="button" hidden>Cancel</button>
        <button class="btn primary" id="mainBtn" type="button">Close</button>
    </footer>

</div>
<script>/*__I18N__*/</script>
<script>
/*__CLIENT__*/
</script>
</body>
</html>
