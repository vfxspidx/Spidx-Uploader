<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activating Spidx Uploader…</title>

<style>
  :root { color-scheme: dark; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1f22;
    color: #f2f3f5;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }

  .card {
    max-width: 380px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 20px;
    border: 3px solid #3a3b3f;
    border-top-color: #5865f2;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  h1 {
    font-size: 18px;
    margin: 0 0 8px;
  }

  p {
    font-size: 14px;
    color: #b5bac1;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 8px;
    background: #5865f2;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .btn:hover {
    background: #4752c4;
  }

  code {
    display: block;
    margin-top: 16px;
    padding: 8px 12px;
    border-radius: 6px;
    background: #2b2d31;
    color: #949ba4;
    font-size: 12px;
    word-break: break-all;
  }
</style>
</head>

<body>

<div class="card">

  <div class="spinner" id="spinner"></div>

  <h1 id="title">
    Opening Spidx Uploader…
  </h1>

  <p id="subtitle">
    Windows should ask if it's OK to open the app.
    If nothing happens in a few seconds, use the button below.
  </p>

  <a
    class="btn"
    id="manualLink"
    href="#"
    style="display:none;"
  >
    Open Spidx Uploader
  </a>

  <code
    id="codeLine"
    style="display:none;"
  ></code>

</div>

<script>
(function () {

  var params = new URLSearchParams(window.location.search);

  var code = (params.get("code") || "")
    .trim()
    .toUpperCase();

  var titleEl = document.getElementById("title");
  var subtitleEl = document.getElementById("subtitle");
  var linkEl = document.getElementById("manualLink");
  var codeEl = document.getElementById("codeLine");
  var spinnerEl = document.getElementById("spinner");

  /*
   * No license code
   */

  if (!code) {

    spinnerEl.style.display = "none";

    titleEl.textContent = "No license code given";

    subtitleEl.textContent =
      "This link is missing its code parameter.";

    return;
  }

  /*
   * Create Spidx custom protocol link
   */

  var deepLink =
    "spidx://activate?code=" +
    encodeURIComponent(code);

  /*
   * Set manual fallback button
   */

  linkEl.href = deepLink;

  /*
   * Show license code
   */

  codeEl.textContent = code;

  /*
   * Automatically launch Spidx Uploader
   */

  window.location.href = deepLink;

  /*
   * Fallback after 1.5 seconds
   */

  setTimeout(function () {

    spinnerEl.style.display = "none";

    titleEl.textContent =
      "Didn't open automatically?";

    subtitleEl.textContent =
      "Click below, or paste this code directly into the app's setup wizard or Dashboard > Account.";

    linkEl.style.display = "inline-block";

    codeEl.style.display = "block";

  }, 1500);

})();
</script>

</body>
</html>
