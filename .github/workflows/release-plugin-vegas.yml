name: Plugin - VEGAS Pro

# Odpala sie TYLKO gdy zmieni sie cos w folderze VEGAS-Plugin/.
# Pozostale pluginy i aplikacja (installer) nie sa ruszane.
#
# WAZNE: przy kazdej zmianie pluginu podbij numer w VEGAS-Plugin/version.txt.
# Aplikacja porownuje wlasnie ten numer z wersja w release 'plugins' - bez
# podbicia wersji uzytkownicy nie zobacza aktualizacji.
on:
  push:
    branches: [main]
    paths:
      - 'VEGAS-Plugin/**'
  workflow_dispatch:

permissions:
  contents: write

# Jeden release 'plugins' wspoldzielony przez 4 workflowy - wykonuja sie po kolei.
concurrency:
  group: plugins-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from version.txt
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < VEGAS-Plugin/version.txt)
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::VEGAS-Plugin/version.txt must contain a version like 1.0.0 (got '$VERSION')"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip plugin
        run: cd VEGAS-Plugin && zip -r "../VEGAS-Plugin-v${{ steps.ver.outputs.version }}.zip" .

      - name: Publish to the 'plugins' release (replace only this plugin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view plugins >/dev/null 2>&1 || gh release create plugins \
            --title "Plugins" \
            --notes "Current plugin builds. This is NOT the app installer." \
            --latest=false
          for old in $(gh release view plugins --json assets -q '.assets[].name' | grep '^VEGAS-Plugin-v' || true); do
            gh release delete-asset plugins "$old" -y
          done
          gh release upload plugins "VEGAS-Plugin-v${{ steps.ver.outputs.version }}.zip" --clobber
