name: Package & release plugins

# Odpala się przy każdym pushu taga w stylu v1.4.0 — tego samego, którego
# pewnie już używasz do release'u głównego instalatora. Ten workflow NIE
# rusza wersji samej aplikacji (SpidxUploaderSetup.exe) — to osobny
# pipeline, osobny numer wersji. Ten plik dotyczy WYŁĄCZNIE pluginów.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # potrzebne, żeby doklejać pliki do Release'a

jobs:
  package-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read CEP-AE version from manifest
        id: ae_version
        run: |
          VERSION=$(grep -oP 'ExtensionBundleVersion="\K[^"]+' CEP-AE/CSXS/manifest.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read CEP-PPRO version from manifest
        id: ppro_version
        run: |
          VERSION=$(grep -oP 'ExtensionBundleVersion="\K[^"]+' CEP-PPRO/CSXS/manifest.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Bezpiecznik: tag (bez "v") MUSI się zgadzać z wersją w obu
      # manifestach, inaczej build pada od razu, zanim cokolwiek
      # opublikujemy. Bez tego łatwo przeoczyć, że ktoś zapomniał podbić
      # ExtensionBundleVersion przed wydaniem taga — wtedy plik w
      # Release'u cicho nazywałby się starą wersją, mimo nowego taga.
      - name: Verify tag matches manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version:    $TAG_VERSION"
          echo "CEP-AE version:   ${{ steps.ae_version.outputs.version }}"
          echo "CEP-PPRO version: ${{ steps.ppro_version.outputs.version }}"

          if [ "$TAG_VERSION" != "${{ steps.ae_version.outputs.version }}" ]; then
            echo "::error::Tag is v$TAG_VERSION but CEP-AE/CSXS/manifest.xml says ${{ steps.ae_version.outputs.version }} — bump ExtensionBundleVersion (and the inner <Extension Version>) before tagging."
            exit 1
          fi
          if [ "$TAG_VERSION" != "${{ steps.ppro_version.outputs.version }}" ]; then
            echo "::error::Tag is v$TAG_VERSION but CEP-PPRO/CSXS/manifest.xml says ${{ steps.ppro_version.outputs.version }} — bump ExtensionBundleVersion (and the inner <Extension Version>) before tagging."
            exit 1
          fi

      - name: Zip CEP-AE
        run: cd CEP-AE && zip -r "../CEP-AE-v${{ steps.ae_version.outputs.version }}.zip" .

      - name: Zip CEP-PPRO
        run: cd CEP-PPRO && zip -r "../CEP-PPRO-v${{ steps.ppro_version.outputs.version }}.zip" .

      - name: Rename UXP panel with the tag's version
        run: cp UXP/com.spidx.workupload_PS.ccx "UXP-Panel-${{ github.ref_name }}.ccx"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CEP-AE-v${{ steps.ae_version.outputs.version }}.zip
            CEP-PPRO-v${{ steps.ppro_version.outputs.version }}.zip
            UXP-Panel-${{ github.ref_name }}.ccx
